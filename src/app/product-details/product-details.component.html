<section>
  <h2>Product Details</h2>
  <h3>{{ productName }}</h3>
  <p>{{ productDescription }}</p>
  <p>Price: ${{ productPrice }} | Status: {{ isAvailable ? 'Available' : 'Unavailable' }}</p>

  <button type="button" aria-label="Decrease quantity" [disabled]="quantity() === 1" (click)="changeQuantity(-1)">−</button>
  <span>Quantity: {{ quantity() }}</span>
  <button type="button" aria-label="Increase quantity" (click)="changeQuantity(1)">+</button>
  <button type="button" [disabled]="!isAvailable" (click)="addProduct()">Add to Cart</button>
</section>
