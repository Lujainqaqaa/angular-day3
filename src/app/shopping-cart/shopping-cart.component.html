<section>
  <h2>Shopping Cart</h2>

  @if (item; as product) {
    <p>Product: {{ product.name }}</p>
    <p>Unit Price: ${{ product.price | number }}</p>
    <p>Quantity: {{ product.quantity }}</p>
    <p><strong>Total Price: ${{ product.price * product.quantity | number }}</strong></p>
  } @else {
    <p>Your cart is empty.</p>
  }
</section>
