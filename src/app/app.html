<main>
  <h1>ElectroShop</h1>

  <button type="button" (click)="showProduct('Laptop', 'Dell Laptop, Core i7, 16GB RAM', 850, true)">
    Laptop
  </button>
  <button type="button" (click)="showProduct('Wireless Headphones', 'Bluetooth Headphones', 120, true)">
    Wireless Headphones
  </button>

  <!-- Read signals with () and pass the values to the child inputs. -->
  <app-product-details
    [productName]="productName()"
    [productDescription]="productDescription()"
    [productPrice]="productPrice()"
    [isAvailable]="isAvailable()"
    (addToCart)="onAddToCart($event)"
  ></app-product-details>

  <app-shopping-cart [item]="cartItem()"></app-shopping-cart>
</main>
